services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: student_club_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: student_club
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Flask Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_club_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword2026@db:5432/student_club
      SECRET_KEY: bmad-super-secret-jwt-key-student-club-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # 3. React Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_club_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
